name: publish

# Auto-publish to PyPI when a new tag is pushed (e.g. `git tag v0.2.0 && git push --tags`).
#
# REQUIRED ONE-TIME SETUP (repo owner only):
#   1. Create a PyPI account at https://pypi.org/account/register/
#   2. Generate an API token: https://pypi.org/manage/account/token/
#      (scope it to "Entire account" the first time; later scope to this project)
#   3. Add the token as a repo secret named PYPI_API_TOKEN:
#      Settings → Secrets and variables → Actions → New repository secret
#
# After setup, every `git push --tags` of a tag matching v*.*.* will publish.
# To dry-run without publishing, push the tag with `--dry-run` testpypi env first.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:        # allow manual trigger from the Actions UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # required for trusted publishing (alternative to token)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        # GITHUB_REF_NAME is read as a shell env var (never interpolated
        # via ${{ }} into the script); tags are pushed by the owner only.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          INIT="$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/hubmesh/__init__.py").read()).group(1))')"
          SRV="$(python -c 'import json; print(json.load(open("server.json"))["version"])')"
          echo "tag=$TAG pyproject=$PKG __init__=$INIT server.json=$SRV"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$INIT" ] || [ "$TAG" != "$SRV" ]; then
            echo "::error::version mismatch between tag, pyproject.toml, __init__.py and server.json"
            exit 1
          fi

      - name: Run the test suite before publishing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
          pytest tests/ -q

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: |
          python -m build
          python -m twine check dist/*
          ls -la dist/

      - name: Smoke-test the built wheel in a fresh environment
        # The artefact about to be uploaded — not the editable checkout —
        # must install with the mcp extra, import, and start in a clean
        # venv. 0.4.1's unpinned `mcp` resolved to SDK 2.x and failed at
        # import; nothing before upload would have caught it.
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet --upgrade pip
          WHEEL="$(ls dist/hubmesh-*.whl)"
          /tmp/wheeltest/bin/pip install --quiet "${WHEEL}[mcp]"
          /tmp/wheeltest/bin/pip check
          /tmp/wheeltest/bin/python -c "import hubmesh, hubmesh.mcp_server as m, importlib.metadata as md; v = md.version('mcp'); print('hubmesh', hubmesh.__version__, 'mcp', v); assert v.startswith('1.'), v; assert m.resolve_security('sse', '127.0.0.1', True, 'k', False, False).read_only"
          /tmp/wheeltest/bin/hubmesh-mcp --help > /dev/null
          # exposed serving without a key must refuse to start
          if /tmp/wheeltest/bin/hubmesh-mcp --transport sse --allow-tunnel --port 8765 > /tmp/refuse.log 2>&1; then
            echo "::error::server started behind --allow-tunnel without an API key"
            exit 1
          fi
          grep -q "refusing to serve" /tmp/refuse.log
          # loopback SSE startup with a key: the endpoint must answer 401 without the bearer
          HUBMESH_API_KEY=smoke /tmp/wheeltest/bin/hubmesh-mcp --transport sse --port 8765 > /tmp/sse.log 2>&1 &
          SERVER=$!
          code=""
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8765/sse || true)"
            [ "$code" = "401" ] && break
            sleep 1
          done
          kill "$SERVER" || true
          echo "GET /sse without bearer -> HTTP ${code}"
          [ "$code" = "401" ] || { cat /tmp/sse.log; exit 1; }

      - name: Upload to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload \
            --username __token__ \
            --password "$PYPI_API_TOKEN" \
            dist/*

      - name: Skip publish (no PYPI_API_TOKEN secret set)
        if: ${{ env.PYPI_API_TOKEN == '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "::warning::PYPI_API_TOKEN secret is not set; built artefacts but did not publish."
          echo "Add the token in Settings → Secrets and variables → Actions to enable publishing."
